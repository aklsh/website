{{ $taxo := "tags" }}
{{ with .Param $taxo }}
  <ul class="tags__list">
    {{ range $tag := . }}
      {{ with $.Site.GetPage (printf "/%s/%s" $taxo ($tag | urlize)) }}
        <li class="tag__item">
          <a class="tag__link" href="{{ .RelPermalink }}">{{ $tag }}</a>
        </li>
      {{ end }}
    {{ end }}
  </ul>
{{ end }}
